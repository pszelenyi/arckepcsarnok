<!DOCTYPE html>

<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arcképcsarnok - Semmelweis Egyetem</title>

    <style>

        /* --- Semmelweis Arculati Színek & Alapstílusok --- */

        :root {

            --se-navy: #002F6C;      /* Semmelweis Sötétkék */

            --se-gold: #C5A059;      /* Akadémiai Arany */

            --se-light-bg: #F4F6F9;  /* Világosszürke háttér */

            --card-bg: #FFFFFF;

            --text-dark: #222222;

            --text-muted: #666666;

            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            --transition: all 0.25s ease-in-out;

        }

 

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

 

        body {

            background-color: var(--se-light-bg);

            color: var(--text-dark);

            line-height: 1.6;

        }

 

        /* --- Fejléc / Header --- */

        header {

            background-color: var(--se-navy);

            color: white;

            padding: 2rem 1rem;

            text-align: center;

            border-bottom: 5px solid var(--se-gold);

            box-shadow: var(--shadow);

        }

 

        header h1 {

            font-size: 2.2rem;

            letter-spacing: 1px;

            margin-bottom: 0.5rem;

            text-transform: uppercase;

        }

 

        header p {

            font-size: 1.1rem;

            color: var(--se-gold);

            font-weight: 300;

        }

 

        /* --- Kereső és Szűrősáv --- */

        .container {

            max-width: 1200px;

            margin: 0 auto;

            padding: 2rem 1rem;

        }

 

        .search-bar {

            margin-bottom: 2rem;

            display: flex;

            justify-content: center;

        }

 

        .search-bar input {

            width: 100%;

            max-width: 500px;

            padding: 0.8rem 1.2rem;

            font-size: 1rem;

            border: 2px solid #D0D7DE;

            border-radius: 30px;

            outline: none;

            transition: var(--transition);

            box-shadow: var(--shadow);

        }

 

        .search-bar input:focus {

            border-color: var(--se-navy);

            box-shadow: 0 0 8px rgba(0, 47, 108, 0.3);

        }

 

        /* --- Csempe Rácsszerkezet (Grid) --- */

        .grid {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

            gap: 1.5rem;

        }

 

        .card {

            background-color: var(--card-bg);

            border-radius: 8px;

            overflow: hidden;

            box-shadow: var(--shadow);

            border-top: 4px solid var(--se-navy);

            padding: 1.5rem;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            transition: var(--transition);

            cursor: pointer;

        }

 

        .card:hover {

            transform: translateY(-5px);

            border-top-color: var(--se-gold);

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

        }

 

        .card h3 {

            color: var(--se-navy);

            font-size: 1.25rem;

            margin-bottom: 0.4rem;

        }

 

        .card .years {

            color: var(--se-gold);

            font-weight: bold;

            font-size: 0.95rem;

            margin-bottom: 0.8rem;

        }

 

        .card .dept {

            font-size: 0.85rem;

            color: var(--text-muted);

            background-color: #EEF2F7;

            padding: 0.3rem 0.6rem;

            border-radius: 4px;

            display: inline-block;

            margin-bottom: 1.2rem;

        }

 

        .card .btn {

            align-self: flex-start;

            color: var(--se-navy);

            font-weight: bold;

            font-size: 0.9rem;

            text-decoration: none;

            display: flex;

            align-items: center;

            gap: 0.3rem;

            transition: var(--transition);

        }

 

        .card:hover .btn {

            color: var(--se-gold);

            padding-left: 5px;

        }

 

        /* --- Felugró Modális Ablak (Modal) --- */

        .modal-overlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background-color: rgba(0, 0, 0, 0.6);

            display: flex;

            justify-content: center;

            align-items: center;

            opacity: 0;

            visibility: hidden;

            transition: var(--transition);

            z-index: 1000;

            padding: 1rem;

        }

 

        .modal-overlay.active {

            opacity: 1;

            visibility: visible;

        }

 

        .modal-content {

            background-color: white;

            border-radius: 10px;

            max-width: 650px;

            width: 100%;

            max-height: 85vh;

            overflow-y: auto;

            padding: 2rem;

            position: relative;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            border-top: 6px solid var(--se-gold);

        }

 

        .close-btn {

            position: absolute;

            top: 1rem;

            right: 1.2rem;

            font-size: 1.8rem;

            background: none;

            border: none;

            color: var(--text-muted);

            cursor: pointer;

            transition: var(--transition);

        }

 

        .close-btn:hover {

            color: var(--se-navy);

        }

 

        .modal-header h2 {

            color: var(--se-navy);

            font-size: 1.8rem;

            margin-bottom: 0.2rem;

        }

 

        .modal-header .modal-years {

            color: var(--se-gold);

            font-weight: bold;

            font-size: 1.1rem;

            margin-bottom: 0.5rem;

        }

 

        .modal-header .modal-dept {

            font-size: 0.9rem;

            color: var(--text-muted);

            margin-bottom: 1.5rem;

            border-bottom: 1px solid #E5E5E5;

            padding-bottom: 1rem;

        }

 

        .modal-body {

            font-size: 1rem;

            color: #333333;

            line-height: 1.7;

        }

    </style>

</head>

<body>

 

    <header>

        <h1>Semmelweis Egyetem</h1>

        <p>Online Arcképcsarnok & Digitális Panteon</p>

    </header>

 

    <div class="container">

        <!-- Keresősáv -->

        <div class="search-bar">

            <input type="text" id="searchInput" placeholder="Keresés név vagy klinika/kar alapján..." onkeyup="filterCards()">

        </div>

 

        <!-- Csempék Rácsa -->

        <div class="grid" id="cardGrid"></div>

    </div>

 

    <!-- Modális Részletező Ablak -->

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">

        <div class="modal-content">

            <button class="close-btn" onclick="closeModal()">&times;</button>

            <div class="modal-header">

                <h2 id="modalTitle">Személy Neve</h2>

                <div class="modal-years" id="modalYears">Születési - Elhalálozási év</div>

                <div class="modal-dept" id="modalDept">Szervezeti egység</div>

            </div>

            <div class="modal-body" id="modalBody">

                <p>A szócikk részletes tartalma itt fog megjelenni...</p>

            </div>

        </div>

    </div>

 

    <script>

        // --- Adatbázis (30 professzor adatai a források alapján) ---

        const doctors = [

            { name: "Dr. Árkövy József", years: "1851 – 1922", dept: "Fogorvostudományi Kar", bio: "A magyar fogászat és stomatológia egyik legkiemelkedőbb úttörője, az egyetemi fogászati oktatás megteremtője." },

            { name: "Dr. Balassa János", years: "1814 – 1868", dept: "Sebészeti Klinika", bio: "A modern magyar sebészet megteremtője, az anesztézia és a műtéti eljárások hazai úttörője." },

            { name: "Dr. Balogh Károly", years: "1895 – 1973", dept: "Fogorvostudományi Kar", bio: "Nemzetközileg elismert fogorvos professzor, a fogászati klinika és szájsebészeti oktatás meghatározó alakja." },

            { name: "Dr. Barta Lajos", years: "1912 – 2000", dept: "Gyermekgyógyászati Klinika", bio: "Kiemelkedő gyermekgyógyász, a gyermekkori endokrinológia és metabolikus betegségek szakértője." },

            { name: "Dr. Bánóczy Jolán", years: "1929 – 2016", dept: "Fogorvostudományi Kar", bio: "A Fogorvostudományi Kar korábbi dékánja, a stomatológia és az orális medicina nemzetközi hírű professzora." },

            { name: "Dr. Bársony János", years: "1860 – 1926", dept: "Szülészeti és Nőgyógyászati Klinika", bio: "Szülész-nőgyógyász professzor, az operatív szülészet és a nőgyógyászati daganatellenes küzdelem képviselője." },

            { name: "Bene Ferenc", years: "1775 – 1858", dept: "Különös kór- és gyógytan", bio: "Orvosdoktor, egyetemi tanár, a himlőoltás hazai elterjesztője és az orvosi oktatás átszervezője." },

            { name: "Dr. Berentey György", years: "1925 – 2004", dept: "Traumatológiai Klinika", bio: "A hazai traumatológia és baleseti sebészet iskolateremtő professzora." },

            { name: "Dr. Berényi Béla", years: "1911 – 2005", dept: "Fogorvostudományi Kar", bio: "A szájsebészet és fogászat professzora, szakkönyvek és egyetemi jegyzetek szerzője." },

            { name: "Dr. Békefi Dezső", years: "1941 – 2024", dept: "Gyermekgyógyászati Klinika", bio: "Elismert gyermekgyógyász és neonatológus, a koraszülött-ellátás elkötelezett művelője." },

            { name: "Dr. Blaskovics László", years: "1869 – 1938", dept: "Szemészeti Klinika", bio: "Világhírű szemész professzor, a szemhéj- és plasztikai műtétek újítója." },

            { name: "Dr. Boros Sándor", years: "1907 – 1987", dept: "Fogorvostudományi Kar", bio: "Fogorvos professzor, a konzerváló fogászat és protetika oktatója." },

            { name: "Dr. Bókai János jun.", years: "1858 – 1937", dept: "Gyermekgyógyászati Klinika", bio: "A gyermekklinika igazgatója, a modern magyar gyermekgyógyászat egyik legnagyobb alakja." },

            { name: "Dr. Bókai János sen.", years: "1822 – 1884", dept: "Gyermekgyógyászati Klinika", bio: "A Stefánia Gyermekkórház megalapítója és a gyermekkórtan első egyetemi tanára." },

            { name: "Dr. Clauder Ottó Ervin", years: "1907 – 1985", dept: "Gyógyszerészi Szerves Vegytan", bio: "Kiváló gyógyszerészvegyész, a gyógyszerészi szerves kémiai kutatások vezetője." },

            { name: "Dr. Csaba György", years: "1929 – 2020", dept: "Molekuláris Biológiai Tanszék", bio: "Nemzetközileg elismert humánbiológus, a hormonális receptorgenezis és receptor-receptivitás kutatója." },

            { name: "Dr. Cserháti Endre", years: "1932 – 2025", dept: "Gyermekgyógyászati Klinika", bio: "A gyermekkori allergológia és pulmonológia úttörője és hazai megalapozója." },

            { name: "Dr. Csiba Árpád", years: "1928 – 2004", dept: "Fogorvostudományi Kar", bio: "A szájpatológia és fogászati kórbonctan elismert professzora." },

            { name: "Dr. Csömör Sándor", years: "1919 – 2007", dept: "Szülészeti és Nőgyógyászati Klinika", bio: "A I. sz. Szülészeti és Nőgyógyászati Klinika volt igazgatója, a nőgyógyászati onkológia szakértője." },

            { name: "Dr. Dénes József", years: "1939 – 1999", dept: "Fogorvostudományi Kar", bio: "A gyermekfogászat és fogszabályozás elismert oktatója és kutatója." },

            { name: "Dr. Entz László", years: "1951 – 2023", dept: "Érsebészeti Tanszék", bio: "Nemzetközileg elismert érsebész professzor, a rekonstrukciós érsebészet szaktekintélye." },

            { name: "Dr. Fábián Gábor", years: "1962 – 2016", dept: "Fogorvostudományi Kar", bio: "A gyermekfogászati és fogszabályozási klinika elhivatott oktatója és kutatója." },

            { name: "Dr. Fábián Tibor", years: "1934 – 2019", dept: "Fogorvostudományi Kar", bio: "A Fogpótlástani Klinika volt igazgatója, a fogászati protetika professzora." },

            { name: "Fodor József", years: "1843 – 1901", dept: "Közegészségtani Tanszék", bio: "A közegészségtan és hygiéne nemzetközileg elismert úttörője, a tanszék megalapítója." },

            { name: "Dr. Kelemen Endre", years: "1921 – 2000", dept: "Belgyógyászati és Onkológiai Klinika", bio: "Kiemelkedő hematológus professzor, az őssejtkutatás és csontvelő-transzplantáció hazai úttörője." },

            { name: "Dr. Kerpel-Fronius Ödön", years: "1906 – 1984", dept: "Gyermekgyógyászati Klinika", bio: "Kossuth-díjas gyermekgyógyász, a gyermekkori só- és vízháztartási zavarok világviszonylatban elismert kutatója." },

            { name: "Dr. Korányi Sándor", years: "1866 – 1944", dept: "Belgyógyászati és Onkológiai Klinika", bio: "A funkcionális belgyógyászati szemlélet megteremtője, a veseelégtelenség patomechanizmusának leírója." },

            { name: "Dr. Rusznyák István", years: "1889 – 1974", dept: "Belgyógyászati és Onkológiai Klinika", bio: "A Magyar Tudományos Akadémia hosszú ideig regnáló elnöke, a nyirokkeringés élettani kutatója." },

            { name: "Dr. Schaffer Károly", years: "1864 – 1939", dept: "Neurológiai Klinika", bio: "A magyar agykutatás és idegkórtan kimagasló professzora, szövettani kutató." },

            { name: "Semmelweis Ignác", years: "1818 – 1865", dept: "Szülészeti és Nőgyógyászati Klinika", bio: "Az 'anyák megmentője', a gyermekágyi láz okának felfedezője és a klórvizes kézmosási antiseptikum úttörője." }

        ];

 

        // --- Csempék dinamikus kirajzolása ---

        const grid = document.getElementById('cardGrid');

 

        function renderCards(data) {

            grid.innerHTML = '';

            data.forEach((doc, index) => {

                const card = document.createElement('div');

                card.className = 'card';

                card.onclick = () => openModal(doc);

                card.innerHTML = `

                    <div>

                        <h3>${doc.name}</h3>

                        <div class="years">${doc.years}</div>

                        <div class="dept">${doc.dept}</div>

                    </div>

                    <div class="btn">Részletes szócikk ➔</div>

                `;

                grid.appendChild(card);

            });

        }

 

        // --- Keresési funkció ---

        function filterCards() {

            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = doctors.filter(d =>

                d.name.toLowerCase().includes(query) ||

                d.dept.toLowerCase().includes(query)

            );

            renderCards(filtered);

        }

 

        // --- Modális ablak kezelése ---

        function openModal(doc) {

            document.getElementById('modalTitle').innerText = doc.name;

            document.getElementById('modalYears').innerText = doc.years;

            document.getElementById('modalDept').innerText = doc.dept;

            document.getElementById('modalBody').innerHTML = `<p>${doc.bio}</p>`;

            document.getElementById('modalOverlay').classList.add('active');

        }

 

        function closeModal() {

            document.getElementById('modalOverlay').classList.remove('active');

        }

 

        function closeModalOutside(event) {

            if (event.target.id === 'modalOverlay') {

                closeModal();

            }

        }

 

        // Kezdeti kirajzolás

        renderCards(doctors);

    </script>

</body>

</html>
